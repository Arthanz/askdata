[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "askdata"
version = "0.1.0"
description = "A chat-with-your-data agent that knows when it's wrong"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.1.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.40.0", "plotly>=5.24.0"]
predict = ["scikit-learn>=1.5.0"]
llm = ["openai>=1.50.0", "anthropic>=0.40.0"]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
